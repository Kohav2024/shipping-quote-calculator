<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316314d'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f3f0e8;
      --paper: #fffdf8;
      --ink: #1c2430;

      --navy: #16314d;

      font-weight: 700;
    }
    .spot-card h2 {

    .spot-lane {

      font-weight: 700;

    .spot-sailing {

      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;

    .spot-of {

      font-weight: 700;
      color: var(--muted);
    }
    .spot-of-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--navy);
    }
    .spot-of-typ { font-size: 0.9rem; font-weight: 700; color: var(--ink); }
    .spot-etd-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      font-size: 0.82rem;
    }

    .spot-etd-row .delayed { font-weight: 800; color: var(--accent); }
    .spot-avail { margin: 6px 0 0; font-size: 0.84rem; }
    .spot-facts {
      margin: 8px 0 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      font-size: 0.84rem;
    }
    .spot-facts .full { grid-column: 1 / -1; }
    .spot-facts dt { color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .spot-facts dd { margin: 0; font-weight: 600; }
    .spot-empty { margin-top: 12px; }
    @media (min-width: 720px) {
      .spot-filters .spot-filter-row { grid-template-columns: 1fr 1fr; }
    }
    body.hist-open { overflow: hidden; }
    .hist-sheet-root {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .hist-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(22, 49, 77, 0.35);
    }
    .hist-sheet {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: min(80vh, 560px);
      overflow: auto;
      background: var(--paper);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 28px rgba(22, 49, 77, 0.18);
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    }
    .hist-sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hist-sheet-head h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--navy);
      line-height: 1.35;
      flex: 1;
      min-width: 0;
    }
    .hist-close {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px 10px;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .hist-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .hist-item {
      width: 100%;
      text-align: start;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;

      font: inherit;
      display: grid;
      gap: 2px;
    }
    .hist-item:hover, .hist-item[aria-current="true"] {
      border-color: var(--info-bd);

    }
    .hist-item-title { font-weight: 700; color: var(--navy); }
    .hist-item-meta { font-size: 0.82rem; color: var(--muted); }
    .hist-status {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 8px;
      width: fit-content;
    }
    .hist-status.is-valid { background: var(--accent-soft); color: var(--accent); }
    .hist-status.is-future { background: var(--info-bg); color: var(--info-ink); }
    .hist-status.is-expired { background: #f3f0ea; color: var(--muted); }
    .card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      color: var(--navy);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .card-head h2 { margin: 0; }
    .wrap, .card, header.hero .wrap { max-width: 100%; }
    .grid { display: grid; gap: 12px; }
    .grid > * { min-width: 0; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    label.fld, .fld-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cfc9bd;
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--navy-2);
      box-shadow: 0 0 0 3px rgba(30, 74, 116, 0.15);
    }
    input:disabled, select:disabled { background: #f3f1eb; color: #8a8f97; }
    .hint { font-size: 0.92rem; color: var(--muted); margin: 6px 0 0; }
    .meta { font-size: 0.92rem; color: var(--ink); margin: 0 0 4px; }
    .seg {

      background: #efebe3;
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }
    .seg button {

    .callout strong { display: block; margin-bottom: 4px; }

    .callout.info { background: var(--info-bg); border-color: var(--info-bd); color: var(--info-ink); }

    .cal-toggle {
      flex: 0 0 44px;
      width: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .cal-toggle svg { width: 22px; height: 22px; display: block; }
    body.cal-open { overflow: hidden; }
    .cal-root {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .cal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(22, 49, 77, 0.35);
    }

  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (state.calOpen) { e.preventDefault(); closeCalendar(); return; }
    if (state.noticeOpen) { e.preventDefault(); closeNotice(); return; }
    if (state.historyOpen) {
      e.preventDefault();
      state.historyOpen = false;
      render();
    }
  });
  function onViewportChange() {
    if (comboOpen) positionOriginList();
  }
  const tabRates = document.getElementById("tab-rates");
  const tabSpots = document.getElementById("tab-spots");
  if (tabRates) tabRates.addEventListener("click", function () { state.view = "rates"; render(); });
  if (tabSpots) tabSpots.addEventListener("click", function () { state.view = "spots"; render(); });
  window.addEventListener("resize", onViewportChange);
  window.addEventListener("scroll", onViewportChange, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onViewportChange);
    window.visualViewport.addEventListener("scroll", onViewportChange);
  }

  render();
})();
  </script>
</body>
</html>
