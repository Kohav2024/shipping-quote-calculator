<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316314d'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f3f0e8;

    body.hist-open { overflow: hidden; }

      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .hist-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(22, 49, 77, 0.35);
    }
    .hist-sheet {

      width: 100%;

      max-height: min(80vh, 560px);

      background: var(--paper);

    }
    .hist-sheet-head {

      margin-bottom: 10px;
    }
    .hist-sheet-head h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--navy);
      line-height: 1.35;
      flex: 1;
      min-width: 0;
    }
    .hist-close {

      font-size: 0.85rem;

    .hist-status.is-valid { background: var(--accent-soft); color: var(--accent); }
    .hist-status.is-future { background: var(--info-bg); color: var(--info-ink); }
    .hist-status.is-expired { background: #f3f0ea; color: var(--muted); }
    .card h2 {

      font-size: 1.15rem;

    }

      flex-wrap: wrap;

    }
    .card-head h2 { margin: 0; }
    .wrap, .card, header.hero .wrap { max-width: 100%; }
    .grid { display: grid; gap: 12px; }

    .grid-2 { grid-template-columns: 1fr 1fr; }

    label.fld, .fld-label {

    }

        e.preventDefault();
        if (state.calOpen) closeCalendar();
        else openCalendar();
      });
    }
    const calBackdrop = $("cal-backdrop");
    if (calBackdrop) calBackdrop.addEventListener("click", function () { closeCalendar(); });
    const calPrev = $("cal-prev");
    if (calPrev) calPrev.addEventListener("click", function () { shiftCalMonth(-1); });
    const calNext = $("cal-next");
    if (calNext) calNext.addEventListener("click", function () { shiftCalMonth(1); });
    const calToday = $("cal-today");
    if (calToday) calToday.addEventListener("click", function () { setShipDate(todayIso()); });
    document.querySelectorAll("[data-cal-date]").forEach(function (btn) {
      btn.addEventListener("click", function () { setShipDate(btn.getAttribute("data-cal-date")); });
    });
    const calPopup = $("cal-popup");
    if (calPopup) calPopup.focus({ preventScroll: true });
    document.querySelectorAll("[data-jump-date]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const iso = btn.getAttribute("data-jump-date");
        if (!iso) return;
        state.dateText = fmtDate(iso);
        state.versionOverride = {};
        state.copied = false;
        state.copyFallback = "";
        render();
      });
    });
    $("qty").addEventListener("change", (e) => { state.qtyText = e.target.value; render(); });
    $("markup").addEventListener("change", (e) => { state.markupText = e.target.value; render(); });
    const grossWtEl = $("gross-wt");
    if (grossWtEl) {
      grossWtEl.addEventListener("change", (e) => { state.grossWtText = e.target.value; state.copied = false; state.copiedId = ""; render(); });
    }
    const hazEl = $("haz");
    if (hazEl && !hazEl.disabled) {
      hazEl.addEventListener("change", (e) => { state.haz = e.target.checked; state.copied = false; state.copiedId = ""; render(); });
    }
    const compareBtnEl = $("compare-btn");
    if (compareBtnEl) {
      compareBtnEl.addEventListener("click", function () {
        state.compare = !state.compare;
        state.copied = false;
        state.copiedId = "";
        state.copyFallback = "";
        state.historyOpen = false;
        state.calOpen = false;
        state.noticeOpen = false;
        render();
      });
    }
    function writeCopiedText(text, copiedId) {
      const go = async function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            state.copied = true;
            state.copiedId = copiedId;
            state.copyFallback = "";
            render();
            setTimeout(function () { state.copied = false; state.copiedId = ""; render(); }, 2000);
            return;
          }
        } catch (err) { /* fallback */ }
        state.copied = false;
        state.copiedId = "";
        state.copyFallback = text;
        render();
        const ta = document.getElementById("copy-text");
        if (ta) { ta.focus(); ta.select(); }
      };
      go();
    }
    const copyBtnEl = $("copy-btn");
    if (copyBtnEl && quoteRate && selectedOrigin && shipIso && !isCompare) {
      copyBtnEl.addEventListener("click", function () {
        writeCopiedText(quoteText(displayCarrier, selectedOrigin, state.dest, quoteRate, qty, markup, shipIso, !validRate, quoteOffers), "one");
      });
    }
    document.querySelectorAll("[data-copy-carrier]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const id = btn.getAttribute("data-copy-carrier");
        const entry = compareEntries.find(function (e) { return e.c.id === id; });
        if (!entry || !selectedOrigin || !shipIso) return;
        writeCopiedText(quoteText(entry.ctx.displayCarrier, selectedOrigin, state.dest, entry.ctx.quoteRate, qty, markup, shipIso, !entry.ctx.validRate, entry.ctx.quoteOffers), id);
      });
    });
    const copyCompareEl = $("copy-compare-btn");
    if (copyCompareEl && selectedOrigin && shipIso && compareEntries.length) {
      copyCompareEl.addEventListener("click", function () {
        const chunks = compareEntries.map(function (e) {
          return quoteText(e.ctx.displayCarrier, selectedOrigin, state.dest, e.ctx.quoteRate, qty, markup, shipIso, !e.ctx.validRate, e.ctx.quoteOffers);
        });
        writeCopiedText(chunks.join("\n\n==========\n\n"), "all");
      });
    }
    const extrasPanel = $("extras-panel");
    if (extrasPanel) {
      extrasPanel.addEventListener("toggle", function () { state.extrasOpen = extrasPanel.open; });
    }
    const histLink = $("history-link");
    if (histLink) {
      histLink.addEventListener("click", function () {
        state.historyOpen = !state.historyOpen;
        render();
      });
    }
    const histBackdrop = $("hist-backdrop");
    if (histBackdrop) {
      histBackdrop.addEventListener("click", function () {
        state.historyOpen = false;
        render();
      });
    }
    const histClose = $("hist-close");
    if (histClose) {
      histClose.addEventListener("click", function () {
        state.historyOpen = false;
        render();
      });
    }
    document.querySelectorAll("[data-hist-version]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        pickHistoryVersion(carrier.id, btn.getAttribute("data-hist-version"));
      });
    });
    const histSheet = $("hist-sheet");
    if (histSheet) histSheet.focus({ preventScroll: true });
    document.querySelectorAll("[data-notice-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openNotice(btn.getAttribute("data-notice-id"));
      });
    });
    const spotBanner = document.getElementById("spot-banner");
    if (spotBanner) {
      spotBanner.addEventListener("click", function () {
        openSpotTab(spotBanner.getAttribute("data-spot-origin") || "");
      });
    }
    const noticeBackdrop = $("notice-backdrop");
    if (noticeBackdrop) noticeBackdrop.addEventListener("click", function () { closeNotice(); });
    const noticeClose = $("notice-close");
    if (noticeClose) noticeClose.addEventListener("click", function () { closeNotice(); });
    const noticeSheet = $("notice-sheet");
    if (noticeSheet) noticeSheet.focus({ preventScroll: true });
    const altSel = $("alt-version");
    if (altSel) {
      altSel.addEventListener("change", function (e) {
        if (!isCompare) state.versionOverride[carrier.id] = e.target.value;
        state.copied = false;
        state.copyFallback = "";
        render();
      });
    }

  }

  function isEditableTarget(el) {
    if (!el) return false;
    const node = el.nodeType === 3 ? el.parentElement : el;
    if (!node || !node.closest) return false;
    return !!node.closest("input, textarea, select");
  }
  document.addEventListener("contextmenu", function (e) {
    if (isEditableTarget(e.target)) return;
    e.preventDefault();
  });
  document.addEventListener("copy", function (e) {
    if (isEditableTarget(e.target)) return;
    e.preventDefault();
  });
  document.addEventListener("cut", function (e) {
    if (isEditableTarget(e.target)) return;
    e.preventDefault();
  });
  document.addEventListener("keydown", function (e) {
    const key = (e.key || "").toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && !e.altKey && !e.shiftKey && (key === "u" || key === "s")) {
      e.preventDefault();
      return;
    }
    if (ctrl && e.shiftKey && (key === "i" || key === "j" || key === "c")) {
      e.preventDefault();
      return;
    }
    if (e.key === "F12") e.preventDefault();
  });
  document.addEventListener("pointerdown", function (e) {
    const combo = document.getElementById("origin-combo");
    if (combo && comboOpen && !combo.contains(e.target)) closeOriginList(true);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (state.calOpen) { e.preventDefault(); closeCalendar(); return; }
    if (state.noticeOpen) { e.preventDefault(); closeNotice(); return; }
    if (state.historyOpen) {
      e.preventDefault();
      state.historyOpen = false;
      render();
    }
  });
  function onViewportChange() {
    if (comboOpen) positionOriginList();
  }
  const tabRates = document.getElementById("tab-rates");
  const tabSpots = document.getElementById("tab-spots");
  if (tabRates) tabRates.addEventListener("click", function () { state.view = "rates"; render(); });
  if (tabSpots) tabSpots.addEventListener("click", function () { state.view = "spots"; render(); });
  window.addEventListener("resize", onViewportChange);
  window.addEventListener("scroll", onViewportChange, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onViewportChange);
    window.visualViewport.addEventListener("scroll", onViewportChange);
  }

  render();
})();
  </script>
</body>
</html>
